<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İndirim Mühendisi">
<title>İndirim Mühendisi</title>
<style>
  :root {
    --bg: #f6f7f4; --card: #ffffff; --ink: #16211f; --mute: #66726e; --line: #e3e7e2;
    --brand: #0f766e; --on-brand: #ffffff; --good: #15803d; --bad: #b91c1c; --warn: #b45309;
    --chip-good: #dcfce7; --chip-bad: #fee2e2; --chip-flat: #eef1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1514; --card: #16201e; --ink: #e8efec; --mute: #94a39d; --line: #243330;
      --brand: #2dd4bf; --on-brand: #042f2e; --good: #4ade80; --bad: #f87171; --warn: #fbbf24;
      --chip-good: #12331f; --chip-bad: #3a1717; --chip-flat: #1d2a27;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 640px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  [hidden] { display: none !important; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 11px 14px;
    background: var(--brand); color: var(--on-brand); cursor: pointer;
  }
  button:disabled { opacity: .55; }
  button.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  button.small { padding: 7px 10px; font-size: 14px; }
  input {
    font: inherit; width: 100%; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); color: var(--ink);
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  form.add { display: grid; gap: 8px; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #msg { min-height: 1.4em; margin: 6px 2px 12px; color: var(--mute); font-size: 14px; }
  #msg.err { color: var(--bad); }
  ul { list-style: none; margin: 0; padding: 0; }
  li.item {
    display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px; margin-bottom: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  }
  li.item img {
    width: 72px; height: 72px; object-fit: contain; border-radius: 10px; background: #fff;
    border: 1px solid var(--line);
  }
  .noimg { width: 72px; height: 72px; border-radius: 10px; background: var(--chip-flat); }
  .title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--ink); font-weight: 600; text-decoration: none; font-size: 15px;
  }
  .prices { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
  .now { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .was { color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums; }
  .chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .chip.good { background: var(--chip-good); color: var(--good); }
  .chip.bad { background: var(--chip-bad); color: var(--bad); }
  .chip.flat { background: var(--chip-flat); color: var(--mute); }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; color: var(--mute); font-size: 12px; }
  .meta .warn { color: var(--warn); font-weight: 600; }
  svg.spark { width: 100%; height: 28px; margin-top: 6px; display: block; }
  .empty { text-align: center; color: var(--mute); padding: 32px 8px; }
  footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; color: var(--mute); font-size: 14px; }
  footer .row { align-items: center; }
  footer input { max-width: 90px; text-align: center; }
  .login { margin-top: 20vh; display: grid; gap: 12px; }
  .login p { margin: 0; color: var(--mute); }
</style>
</head>
<body>
<main>
  <section id="login" class="login" hidden>
    <h1>İndirim Mühendisi</h1>
    <p>Devam etmek için panel şifrenizi girin.</p>
    <form id="loginForm" class="add">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Şifre" required>
      <button type="submit">Giriş</button>
    </form>
    <div id="loginMsg" class="err" role="alert"></div>
  </section>

  <section id="panel" hidden>
    <header>
      <h1>İndirim Mühendisi</h1>
      <button id="btnCheck" class="ghost small" type="button">Şimdi kontrol et</button>
    </header>

    <form id="addForm" class="add">
      <input id="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="Hepsiburada / Trendyol ürün linki">
      <div class="row">
        <button id="btnPaste" class="ghost" type="button">Panodan yapıştır</button>
        <button id="btnAdd" type="submit">Takibe al</button>
      </div>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>

    <ul id="list"></ul>

    <footer>
      <div class="row">
        <label for="thr">En az % kaç düşüşte haber verilsin?</label>
        <input id="thr" type="number" min="0" max="90" step="0.5" inputmode="decimal">
        <button id="btnThr" class="ghost small" type="button">Kaydet</button>
      </div>
      <div><button id="btnOut" class="ghost small" type="button">Çıkış</button></div>
    </footer>
  </section>
</main>

<script>
const API = 'https://owbrssrwrfpfidplbofd.supabase.co/functions/v1/panel-api';
const $ = (id) => document.getElementById(id);
let KEY = '';
try { KEY = localStorage.getItem('panelKey') || ''; } catch (_) { /* depolama kapalı olabilir */ }

const fmt = (n) => Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TL';
const SOURCE = { hepsiburada: 'Hepsiburada', trendyol: 'Trendyol' };

async function api(action, body = {}) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-panel-key': KEY },
    body: JSON.stringify({ action, ...body }),
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error(j.error || 'Şifre yanlış'); e.auth = true; throw e; }
  if (!r.ok) throw new Error(j.error || ('Hata (' + r.status + ')'));
  return j;
}

function say(text, isErr = false) {
  const m = $('msg');
  m.textContent = text || '';
  m.className = isErr ? 'err' : '';
}

function show(which) {
  $('login').hidden = which !== 'login';
  $('panel').hidden = which !== 'panel';
}

function ago(iso) {
  if (!iso) return 'henüz kontrol edilmedi';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 2) return 'az önce';
  if (m < 60) return m + ' dk önce';
  const h = Math.round(m / 60);
  return h < 24 ? h + ' sa önce' : Math.round(h / 24) + ' gün önce';
}

function spark(hist, base) {
  if (!hist || hist.length < 2) return null;
  const W = 100, H = 28;
  const vals = hist.map((h) => h[1]);
  const lo = Math.min(...vals, base), hi = Math.max(...vals, base), rng = (hi - lo) || 1;
  const x = (i) => (i / (hist.length - 1)) * W;
  const y = (v) => H - 3 - ((v - lo) / rng) * (H - 6);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('class', 'spark');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Fiyat geçmişi');
  const bl = document.createElementNS(ns, 'line');
  bl.setAttribute('x1', 0); bl.setAttribute('x2', W); bl.setAttribute('y1', y(base)); bl.setAttribute('y2', y(base));
  bl.setAttribute('stroke', 'currentColor'); bl.setAttribute('stroke-opacity', '.35');
  bl.setAttribute('stroke-dasharray', '2 2'); bl.setAttribute('vector-effect', 'non-scaling-stroke');
  svg.appendChild(bl);
  const pl = document.createElementNS(ns, 'polyline');
  pl.setAttribute('points', vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' '));
  pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', 'var(--brand)'); pl.setAttribute('stroke-width', '2');
  pl.setAttribute('stroke-linejoin', 'round'); pl.setAttribute('vector-effect', 'non-scaling-stroke');
  svg.appendChild(pl);
  svg.style.color = 'var(--mute)';
  return svg;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(data) {
  const ul = $('list');
  ul.replaceChildren();
  $('thr').value = data.minDropPct;
  if (!data.items.length) {
    ul.appendChild(el('li', 'empty', 'Henüz takip ettiğin ürün yok. Yukarıya bir link yapıştır.'));
    return;
  }
  for (const it of data.items) {
    const p = it.product;
    const base = Number(it.baselinePrice);
    const cur = p.lastPrice === null ? base : Number(p.lastPrice);
    const d = (cur - base) / base * 100;
    const li = el('li', 'item');

    if (p.imageUrl && /^https:\/\//.test(p.imageUrl)) {
      const img = document.createElement('img');
      img.src = p.imageUrl; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      li.appendChild(img);
    } else {
      li.appendChild(el('div', 'noimg'));
    }

    const box = el('div');
    const a = el('a', 'title', p.title || 'Ürün');
    if (/^https:\/\//.test(p.url)) { a.href = p.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    box.appendChild(a);

    const prices = el('div', 'prices');
    prices.appendChild(el('span', 'now', fmt(cur)));
    prices.appendChild(el('span', 'was', 'eklerken ' + fmt(base)));
    const flat = Math.abs(d) < 0.05;
    const chip = el('span', 'chip ' + (flat ? 'flat' : d < 0 ? 'good' : 'bad'),
      flat ? 'değişmedi' : (d < 0 ? '−%' : '+%') + Math.abs(d).toFixed(1).replace('.', ','));
    prices.appendChild(chip);
    box.appendChild(prices);

    const sp = spark(it.history, base);
    if (sp) box.appendChild(sp);

    const meta = el('div', 'meta');
    const left = el('span');
    const broken = p.failCount >= 3;
    left.textContent = (SOURCE[p.source] || p.source) + ' · ' + (broken ? '' : ago(p.lastCheckedAt));
    if (broken) { const w = el('span', 'warn', 'fiyat okunamıyor'); left.appendChild(w); }
    meta.appendChild(left);
    const del = el('button', 'ghost small', 'Sil');
    del.type = 'button';
    del.addEventListener('click', async () => {
      if (!confirm('Bu ürün takipten çıkarılsın mı?')) return;
      del.disabled = true;
      try { await api('remove', { id: it.id }); await refresh(); } catch (e) { say(e.message, true); del.disabled = false; }
    });
    meta.appendChild(del);
    box.appendChild(meta);

    li.appendChild(box);
    ul.appendChild(li);
  }
}

async function refresh() {
  const data = await api('list');
  show('panel');
  render(data);
}

function extractUrl(text) {
  const m = String(text).match(/https?:\/\/[^\s<>"]+/i);
  return m ? m[0].replace(/[).,;]+$/, '') : null;
}

$('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  KEY = $('pw').value;
  $('loginMsg').textContent = '';
  try {
    await refresh();
    try { localStorage.setItem('panelKey', KEY); } catch (_) { /* yoksay */ }
    $('pw').value = '';
  } catch (e) {
    $('loginMsg').textContent = e.message;
    KEY = '';
  }
});

$('addForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const url = extractUrl($('url').value);
  if (!url) { say('Geçerli bir ürün linki bulamadım.', true); return; }
  $('btnAdd').disabled = true;
  say('Fiyat okunuyor…');
  try {
    const r = await api('add', { url });
    $('url').value = '';
    say(r.status === 'exists'
      ? 'Zaten takipte: eklenen fiyat ' + fmt(r.baseline) + ', şimdi ' + fmt(r.price)
      : 'Takibe alındı: ' + fmt(r.price));
    await refresh();
  } catch (e) {
    say(e.message, true);
  } finally {
    $('btnAdd').disabled = false;
  }
});

$('btnPaste').addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    $('url').value = t;
    if (extractUrl(t)) $('addForm').requestSubmit();
    else say('Panoda ürün linki yok.', true);
  } catch (_) {
    say('Panoya erişilemedi. Linki kutuya elle yapıştırın.', true);
  }
});

$('btnCheck').addEventListener('click', async () => {
  $('btnCheck').disabled = true;
  say('Fiyatlar kontrol ediliyor…');
  try {
    const s = await api('check');
    say(s.checked + ' ürün okundu, ' + s.failed + ' okunamadı, ' + s.notified + ' bildirim gönderildi.');
    await refresh();
  } catch (e) { say(e.message, true); } finally { $('btnCheck').disabled = false; }
});

$('btnThr').addEventListener('click', async () => {
  try { await api('threshold', { value: Number($('thr').value) }); say('Eşik kaydedildi.'); }
  catch (e) { say(e.message, true); }
});

$('btnOut').addEventListener('click', () => {
  try { localStorage.removeItem('panelKey'); } catch (_) { /* yoksay */ }
  KEY = ''; show('login');
});

(async () => {
  if (!KEY) { show('login'); return; }
  try { await refresh(); } catch (e) { show('login'); if (!e.auth) $('loginMsg').textContent = e.message; }
})();
</script>
</body>
</html>
