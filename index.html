<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İndirim Mühendisi">
<title>İndirim Mühendisi</title>
<style>
  :root {
    --bg: #f6f7f4; --card: #ffffff; --ink: #16211f; --mute: #66726e; --line: #e3e7e2;
    --brand: #0f766e; --on-brand: #ffffff; --good: #15803d; --bad: #b91c1c; --warn: #b45309;
    --chip-good: #dcfce7; --chip-bad: #fee2e2; --chip-flat: #eef1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1514; --card: #16201e; --ink: #e8efec; --mute: #94a39d; --line: #243330;
      --brand: #2dd4bf; --on-brand: #042f2e; --good: #4ade80; --bad: #f87171; --warn: #fbbf24;
      --chip-good: #12331f; --chip-bad: #3a1717; --chip-flat: #1d2a27;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 640px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  [hidden] { display: none !important; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 11px 14px;
    background: var(--brand); color: var(--on-brand); cursor: pointer;
  }
  button:disabled { opacity: .55; }
  button.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  button.small { padding: 7px 10px; font-size: 14px; }
  input {
    font: inherit; width: 100%; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); color: var(--ink);
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  form.add { display: grid; gap: 8px; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #msg { min-height: 1.4em; margin: 6px 2px 12px; color: var(--mute); font-size: 14px; }
  #msg.err { color: var(--bad); }
  ul { list-style: none; margin: 0; padding: 0; }
  li.item {
    display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px; margin-bottom: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  }
  li.item img {
    width: 72px; height: 72px; object-fit: contain; border-radius: 10px; background: #fff;
    border: 1px solid var(--line);
  }
  .noimg { width: 72px; height: 72px; border-radius: 10px; background: var(--chip-flat); }
  .title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--ink); font-weight: 600; text-decoration: none; font-size: 15px;
  }
  .prices { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
  .now { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .was { color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums; }
  .chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .chip.good { background: var(--chip-good); color: var(--good); }
  .chip.bad { background: var(--chip-bad); color: var(--bad); }
  .chip.flat { background: var(--chip-flat); color: var(--mute); }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; color: var(--mute); font-size: 12px; }
  .meta .warn { color: var(--warn); font-weight: 600; }
  svg.spark { width: 100%; height: 28px; margin-top: 6px; display: block; }
  .empty { text-align: center; color: var(--mute); padding: 32px 8px; }
  footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; color: var(--mute); font-size: 14px; }
  footer .row { align-items: center; }
  footer input { max-width: 90px; text-align: center; }
  .login { margin-top: 20vh; display: grid; gap: 12px; }
  .login p { margin: 0; color: var(--mute); }
  .summary { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; margin-bottom: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .summary .sub { color: var(--mute); font-size: 13px; }
  .summary .big { font-size: 22px; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
  .summary .big.none { color: var(--mute); }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 9px 6px; font-size: 14px; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; font-weight: 600; }
  .tabs button small { color: var(--mute); font-weight: 600; margin-left: 4px; }
  .tabs button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .tabs button[aria-pressed="true"] small { color: inherit; opacity: .85; }
  select { font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
  .chip.low { background: var(--chip-good); color: var(--good); }
  .goal { margin-top: 8px; font-size: 12px; color: var(--mute); }
  .bar { height: 6px; margin-top: 4px; border-radius: 999px; background: var(--chip-flat); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--good); border-radius: 999px; }
  .acts { display: flex; gap: 6px; }
  li.item .detail { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; }
  svg.big { width: 100%; height: 120px; display: block; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 8px 0 4px; font-size: 14px; }
  .stats b { display: block; font-variant-numeric: tabular-nums; }
  .stats span, .legend { font-size: 12px; color: var(--mute); }
  .legend { margin-bottom: 10px; text-align: center; }
  .goalform { display: flex; gap: 8px; }
  .goalform input { flex: 1; min-width: 0; }
  .goalform select { flex: none; }
  .goalhint { margin: 6px 2px 0; font-size: 12px; color: var(--mute); min-height: 16px; }
  label.switch { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--mute); }
  label.switch input { width: 20px; height: 20px; flex: none; accent-color: var(--brand); }
</style>
</head>
<body>
<main>
  <section id="login" class="login" hidden>
    <h1>İndirim Mühendisi</h1>
    <p>Devam etmek için panel şifrenizi girin.</p>
    <form id="loginForm" class="add">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Şifre" required>
      <button type="submit">Giriş</button>
    </form>
    <div id="loginMsg" class="err" role="alert"></div>
  </section>

  <section id="panel" hidden>
    <header>
      <h1>İndirim Mühendisi</h1>
      <button id="btnCheck" class="ghost small" type="button">Şimdi kontrol et</button>
    </header>

    <form id="addForm" class="add">
      <input id="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="Hepsiburada / Trendyol ürün linki">
      <div class="row">
        <button id="btnPaste" class="ghost" type="button">Panodan yapıştır</button>
        <button id="btnAdd" type="submit">Takibe al</button>
      </div>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>

    <div id="tabs" class="tabs" hidden></div>
    <div id="summary" class="summary" hidden></div>
    <ul id="list"></ul>

    <footer>
      <div class="row">
        <label for="thr">En az % kaç düşüşte haber verilsin?</label>
        <input id="thr" type="number" min="0" max="90" step="0.5" inputmode="decimal">
        <button id="btnThr" class="ghost small" type="button">Kaydet</button>
      </div>
      <div><button id="btnOut" class="ghost small" type="button">Çıkış</button></div>
    </footer>
  </section>
</main>

<script>
const API = 'https://owbrssrwrfpfidplbofd.supabase.co/functions/v1/panel-api';
const $ = (id) => document.getElementById(id);
let KEY = '';
try { KEY = localStorage.getItem('panelKey') || ''; } catch (_) { /* depolama kapalı olabilir */ }

const fmt = (n) => Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TL';
const SOURCE = { hepsiburada: 'Hepsiburada', trendyol: 'Trendyol' };

async function api(action, body = {}) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-panel-key': KEY },
    body: JSON.stringify({ action, ...body }),
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error(j.error || 'Şifre yanlış'); e.auth = true; throw e; }
  if (!r.ok) throw new Error(j.error || ('Hata (' + r.status + ')'));
  return j;
}

function say(text, isErr = false) {
  const m = $('msg');
  m.textContent = text || '';
  m.className = isErr ? 'err' : '';
}

function show(which) {
  $('login').hidden = which !== 'login';
  $('panel').hidden = which !== 'panel';
}

function ago(iso) {
  if (!iso) return 'henüz kontrol edilmedi';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 2) return 'az önce';
  if (m < 60) return m + ' dk önce';
  const h = Math.round(m / 60);
  return h < 24 ? h + ' sa önce' : Math.round(h / 24) + ' gün önce';
}

function spark(hist, base) {
  if (!hist || hist.length < 2) return null;
  const W = 100, H = 28;
  const vals = hist.map((h) => h[1]);
  const lo = Math.min(...vals, base), hi = Math.max(...vals, base), rng = (hi - lo) || 1;
  const x = (i) => (i / (hist.length - 1)) * W;
  const y = (v) => H - 3 - ((v - lo) / rng) * (H - 6);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('class', 'spark');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Fiyat geçmişi');
  const bl = document.createElementNS(ns, 'line');
  bl.setAttribute('x1', 0); bl.setAttribute('x2', W); bl.setAttribute('y1', y(base)); bl.setAttribute('y2', y(base));
  bl.setAttribute('stroke', 'currentColor'); bl.setAttribute('stroke-opacity', '.35');
  bl.setAttribute('stroke-dasharray', '2 2'); bl.setAttribute('vector-effect', 'non-scaling-stroke');
  svg.appendChild(bl);
  const pl = document.createElementNS(ns, 'polyline');
  pl.setAttribute('points', vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' '));
  pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', 'var(--brand)'); pl.setAttribute('stroke-width', '2');
  pl.setAttribute('stroke-linejoin', 'round'); pl.setAttribute('vector-effect', 'non-scaling-stroke');
  svg.appendChild(pl);
  svg.style.color = 'var(--mute)';
  return svg;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const OPEN = new Set();
let DATA = null;
let SORT = 'new';
try { SORT = localStorage.getItem('sortMode') || 'new'; } catch (_) { /* yoksay */ }
if (!['new', 'drop', 'goal'].includes(SORT)) SORT = 'new';
let SHOP = 'all';
try { SHOP = localStorage.getItem('shopFilter') || 'all'; } catch (_) { /* yoksay */ }
if (!['all', 'hepsiburada', 'trendyol'].includes(SHOP)) SHOP = 'all';

const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Fiyat geçmişi (adım grafiği): zaman ekseni, eklendiği fiyat ve hedef çizgisi
function bigChart(hist, cur, base, target) {
  const W = 300, H = 120, PX = 4, PY = 10;
  const pts = hist.map((h) => [new Date(h[0]).getTime(), h[1]]);
  const now = Date.now();
  if (!pts.length || pts[pts.length - 1][0] < now) pts.push([now, cur]);
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  const ys = pts.map((p) => p[1]).concat([base], target ? [target] : []);
  const lo = Math.min(...ys), hi = Math.max(...ys), rng = (hi - lo) || 1;
  const x = (t) => PX + ((t - t0) / ((t1 - t0) || 1)) * (W - 2 * PX);
  const y = (v) => H - PY - ((v - lo) / rng) * (H - 2 * PY);
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'big', role: 'img', 'aria-label': 'Fiyat geçmişi grafiği' });
  const guide = (v, color, dash) => svg.appendChild(svgEl('line', {
    x1: 0, x2: W, y1: y(v), y2: y(v), stroke: color, 'stroke-width': 1,
    'stroke-dasharray': dash, 'vector-effect': 'non-scaling-stroke',
  }));
  guide(base, 'var(--mute)', '3 3');
  if (target) guide(target, 'var(--good)', '1 3');
  let d = '';
  pts.forEach((p, i) => {
    d += (i === 0 ? 'M' + x(p[0]).toFixed(1) + ' ' : 'H' + x(p[0]).toFixed(1) + ' V') + y(p[1]).toFixed(1) + ' ';
  });
  svg.appendChild(svgEl('path', {
    d, fill: 'none', stroke: 'var(--brand)', 'stroke-width': 2, 'stroke-linejoin': 'round',
    'vector-effect': 'non-scaling-stroke',
  }));
  const last = pts[pts.length - 1];
  svg.appendChild(svgEl('circle', { cx: x(last[0]), cy: y(last[1]), r: 3.5, fill: 'var(--brand)' }));
  return svg;
}

// En düşük / en yüksek / zamana göre ağırlıklı ortalama
function stats(hist, cur) {
  const pts = hist.map((h) => [new Date(h[0]).getTime(), h[1]]);
  const now = Date.now();
  if (!pts.length) pts.push([now, cur]);
  let sum = 0, span = 0, lo = Infinity, hi = -Infinity;
  for (let i = 0; i < pts.length; i++) {
    const end = i + 1 < pts.length ? pts[i + 1][0] : Math.max(now, pts[i][0]);
    const w = Math.max(end - pts[i][0], 0);
    sum += pts[i][1] * w; span += w;
    lo = Math.min(lo, pts[i][1]); hi = Math.max(hi, pts[i][1]);
  }
  lo = Math.min(lo, cur); hi = Math.max(hi, cur);
  return { lo, hi, avg: span > 0 ? sum / span : cur, distinct: new Set(pts.map((p) => p[1])).size };
}

function enrich(it) {
  const p = it.product;
  const base = Number(it.baselinePrice);
  const cur = p.lastPrice === null ? base : Number(p.lastPrice);
  const target = it.targetPrice === null || it.targetPrice === undefined ? null : Number(it.targetPrice);
  return { it, p, base, cur, d: (cur - base) / base * 100, target, st: stats(it.history || [], cur) };
}

function goalRatio(e) {
  if (e.target === null) return -1;
  if (e.cur <= e.target) return 1;
  return Math.max(0, Math.min(1, (e.base - e.cur) / (e.base - e.target)));
}

function renderSummary(list) {
  const box = $('summary');
  box.replaceChildren();
  if (!list.length) { box.hidden = true; return; }
  box.hidden = false;
  let saved = 0, down = 0, goals = 0;
  for (const e of list) {
    if (e.cur < e.base) { saved += e.base - e.cur; down++; }
    if (e.target !== null && e.cur <= e.target) goals++;
  }
  const left = el('div');
  left.appendChild(el('div', 'sub', 'Eklendikten sonra toplam tasarruf'));
  left.appendChild(el('div', 'big' + (saved > 0 ? '' : ' none'), fmt(saved)));
  const bits = [list.length + ' üründen ' + down + ' tanesi ucuzladı'];
  if (goals) bits.push(goals + ' hedefe ulaştı');
  left.appendChild(el('div', 'sub', bits.join(' · ')));
  box.appendChild(left);
  const sel = el('select');
  sel.setAttribute('aria-label', 'Sıralama');
  for (const [v, t] of [['new', 'Yeni eklenen'], ['drop', 'En çok düşen'], ['goal', 'Hedefe yakın']]) {
    const o = el('option', '', t); o.value = v; if (v === SORT) o.selected = true; sel.appendChild(o);
  }
  sel.addEventListener('change', () => {
    SORT = sel.value;
    try { localStorage.setItem('sortMode', SORT); } catch (_) { /* yoksay */ }
    render(DATA);
  });
  box.appendChild(sel);
}

function renderTabs(all) {
  const box = $('tabs');
  box.replaceChildren();
  if (!all.length) { box.hidden = true; return; }
  box.hidden = false;
  const count = (k) => k === 'all' ? all.length : all.filter((e) => e.p.source === k).length;
  for (const [k, t] of [['all', 'Tümü'], ['hepsiburada', 'Hepsiburada'], ['trendyol', 'Trendyol']]) {
    const b = el('button', '', t);
    b.type = 'button';
    b.appendChild(el('small', '', String(count(k))));
    b.setAttribute('aria-pressed', k === SHOP ? 'true' : 'false');
    b.addEventListener('click', () => {
      SHOP = k;
      try { localStorage.setItem('shopFilter', SHOP); } catch (_) { /* yoksay */ }
      render(DATA);
    });
    box.appendChild(b);
  }
}

function renderDetail(e) {
  const box = el('div', 'detail');
  box.appendChild(bigChart(e.it.history || [], e.cur, e.base, e.target));
  const row = el('div', 'stats');
  for (const [lab, val] of [['En düşük', e.st.lo], ['Ortalama', e.st.avg], ['En yüksek', e.st.hi]]) {
    const c = el('div');
    c.appendChild(el('b', '', fmt(val)));
    c.appendChild(el('span', '', lab));
    row.appendChild(c);
  }
  box.appendChild(row);
  box.appendChild(el('div', 'legend', '– – eklendiği fiyat' + (e.target !== null ? ' · ··· hedef fiyat' : '') + ' · son 90 gün'));

  const form = el('form', 'goalform');
  const mode = el('select');
  mode.setAttribute('aria-label', 'Hedef türü');
  for (const [v, t] of [['tl', 'TL'], ['pct', '% indirim']]) {
    const o = el('option', '', t); o.value = v; mode.appendChild(o);
  }
  const inp = document.createElement('input');
  inp.type = 'number'; inp.step = '0.01'; inp.min = '0'; inp.inputMode = 'decimal';
  const hint = el('div', 'goalhint');
  const pctOf = (t) => Math.round((e.base - t) / e.base * 1000) / 10;
  const toTl = (pc) => Math.round(e.base * (1 - pc / 100) * 100) / 100;
  const setMode = (m) => {
    mode.value = m;
    inp.placeholder = m === 'pct' ? '🎯 Eklendiği fiyattan % indirim' : '🎯 Hedef fiyat (TL)';
    inp.setAttribute('aria-label', m === 'pct' ? 'Hedef indirim yüzdesi' : 'Hedef fiyat');
    inp.max = m === 'pct' ? '99' : '';
    inp.value = '';
    if (e.target !== null) {
      inp.value = m === 'pct' ? String(pctOf(e.target)) : String(e.target);
    }
    preview();
  };
  const preview = () => {
    const v = Number(inp.value);
    if (inp.value === '' || !Number.isFinite(v) || v <= 0) {
      hint.textContent = e.target !== null
        ? 'Şu an: ' + fmt(e.target) + ' (eklendiği fiyattan %' + String(pctOf(e.target)).replace('.', ',') + ' indirim)'
        : 'Eklendiği fiyat: ' + fmt(e.base);
      return;
    }
    if (mode.value === 'pct') {
      hint.textContent = v >= 100 ? 'Yüzde 100\'den küçük olmalı' : '= ' + fmt(toTl(v)) + ' ve altına düşünce bildirim';
    } else {
      hint.textContent = '= eklendiği fiyattan %' + String(pctOf(v)).replace('.', ',') + ' indirim';
    }
  };
  inp.addEventListener('input', preview);
  mode.addEventListener('change', () => setMode(mode.value));
  const save = el('button', 'small', 'Kaydet');
  save.type = 'submit';
  form.appendChild(mode); form.appendChild(inp); form.appendChild(save);
  if (e.target !== null) {
    const clr = el('button', 'ghost small', 'Kaldır');
    clr.type = 'button';
    clr.addEventListener('click', async () => {
      try { await api('target', { id: e.it.id, value: null }); say('Hedef kaldırıldı.'); await refresh(); }
      catch (err) { say(err.message, true); }
    });
    form.appendChild(clr);
  }
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const n = Number(inp.value);
    if (inp.value === '' || !Number.isFinite(n) || n <= 0) { say('Bir hedef yazın.', true); return; }
    let value = n;
    if (mode.value === 'pct') {
      if (n >= 100) { say('İndirim yüzdesi 100\'den küçük olmalı.', true); return; }
      value = toTl(n);
    }
    save.disabled = true;
    try {
      await api('target', { id: e.it.id, value });
      say('Hedef kaydedildi: ' + fmt(value) + ' (%' + String(pctOf(value)).replace('.', ',') + ' indirim) ve altına düşünce özel bildirim gelir.');
      await refresh();
    } catch (err) { say(err.message, true); save.disabled = false; }
  });
  setMode('tl');
  box.appendChild(form);
  box.appendChild(hint);

  const row2 = el('label', 'switch');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = e.it.notifyAnyChange === true;
  row2.appendChild(cb);
  row2.appendChild(el('span', '', 'Her fiyat değişiminde haber ver (artış dahil)'));
  cb.addEventListener('change', async () => {
    cb.disabled = true;
    try {
      await api('notify', { id: e.it.id, value: cb.checked });
      e.it.notifyAnyChange = cb.checked;
      say(cb.checked ? 'Bu üründe her fiyat değişimi bildirilecek.' : 'Sadece indirimler bildirilecek.');
    } catch (err) { cb.checked = !cb.checked; say(err.message, true); }
    cb.disabled = false;
  });
  box.appendChild(row2);
  return box;
}

function render(data) {
  DATA = data;
  const ul = $('list');
  ul.replaceChildren();
  $('thr').value = data.minDropPct;
  const all = data.items.map(enrich);
  renderTabs(all);
  const list = SHOP === 'all' ? all : all.filter((e) => e.p.source === SHOP);
  renderSummary(list);
  if (!list.length) {
    ul.appendChild(el('li', 'empty', all.length
      ? 'Bu mağazada takip ettiğin ürün yok.'
      : 'Henüz takip ettiğin ürün yok. Yukarıya bir link yapıştır.'));
    return;
  }
  if (SORT === 'drop') list.sort((a, b) => a.d - b.d);
  else if (SORT === 'goal') list.sort((a, b) => goalRatio(b) - goalRatio(a));

  for (const e of list) {
    const { it, p, base, cur, d, target } = e;
    const li = el('li', 'item');

    if (p.imageUrl && /^https:\/\//.test(p.imageUrl)) {
      const img = document.createElement('img');
      img.src = p.imageUrl; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      li.appendChild(img);
    } else {
      li.appendChild(el('div', 'noimg'));
    }

    const box = el('div');
    const a = el('a', 'title', p.title || 'Ürün');
    if (/^https:\/\//.test(p.url)) { a.href = p.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    box.appendChild(a);

    const prices = el('div', 'prices');
    prices.appendChild(el('span', 'now', fmt(cur)));
    prices.appendChild(el('span', 'was', 'eklerken ' + fmt(base)));
    const flat = Math.abs(d) < 0.05;
    prices.appendChild(el('span', 'chip ' + (flat ? 'flat' : d < 0 ? 'good' : 'bad'),
      flat ? 'değişmedi' : (d < 0 ? '−%' : '+%') + Math.abs(d).toFixed(1).replace('.', ',')));
    if (e.st.distinct > 1 && cur <= e.st.lo) prices.appendChild(el('span', 'chip low', '⭐ En düşük'));
    box.appendChild(prices);

    if (target !== null) {
      const g = el('div', 'goal');
      g.textContent = cur <= target
        ? '🎯 Hedefe ulaştı (' + fmt(target) + ')'
        : '🎯 Hedef ' + fmt(target) + ' (%' + String(Math.round((base - target) / base * 1000) / 10).replace('.', ',') + ') · ' + fmt(cur - target) + ' kaldı';
      const bar = el('div', 'bar');
      const fill = document.createElement('i');
      fill.style.width = Math.round(goalRatio(e) * 100) + '%';
      bar.appendChild(fill);
      g.appendChild(bar);
      box.appendChild(g);
    }

    const sp = spark(it.history, base);
    if (sp) box.appendChild(sp);

    const meta = el('div', 'meta');
    const left = el('span');
    const broken = p.failCount >= 3;
    left.textContent = (SOURCE[p.source] || p.source) + ' · ' + (broken ? '' : ago(p.lastCheckedAt));
    if (broken) { left.appendChild(el('span', 'warn', 'fiyat okunamıyor')); }
    meta.appendChild(left);
    const acts = el('span', 'acts');
    const open = OPEN.has(it.id);
    const det = el('button', 'ghost small', open ? 'Kapat' : 'Detay');
    det.type = 'button';
    det.setAttribute('aria-expanded', String(open));
    det.addEventListener('click', () => { if (OPEN.has(it.id)) OPEN.delete(it.id); else OPEN.add(it.id); render(DATA); });
    acts.appendChild(det);
    const del = el('button', 'ghost small', 'Sil');
    del.type = 'button';
    del.addEventListener('click', async () => {
      if (!confirm('Bu ürün takipten çıkarılsın mı?')) return;
      del.disabled = true;
      try { await api('remove', { id: it.id }); OPEN.delete(it.id); await refresh(); } catch (err) { say(err.message, true); del.disabled = false; }
    });
    acts.appendChild(del);
    meta.appendChild(acts);
    box.appendChild(meta);

    li.appendChild(box);
    if (open) li.appendChild(renderDetail(e));
    ul.appendChild(li);
  }
}

async function refresh() {
  const data = await api('list');
  show('panel');
  render(data);
}

function extractUrl(text) {
  const m = String(text).match(/https?:\/\/[^\s<>"]+/i);
  return m ? m[0].replace(/[).,;]+$/, '') : null;
}

$('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  KEY = $('pw').value;
  $('loginMsg').textContent = '';
  try {
    await refresh();
    try { localStorage.setItem('panelKey', KEY); } catch (_) { /* yoksay */ }
    $('pw').value = '';
  } catch (e) {
    $('loginMsg').textContent = e.message;
    KEY = '';
  }
});

$('addForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const url = extractUrl($('url').value);
  if (!url) { say('Geçerli bir ürün linki bulamadım.', true); return; }
  $('btnAdd').disabled = true;
  say('Fiyat okunuyor…');
  try {
    const r = await api('add', { url });
    $('url').value = '';
    say(r.status === 'exists'
      ? 'Zaten takipte: eklenen fiyat ' + fmt(r.baseline) + ', şimdi ' + fmt(r.price)
      : 'Takibe alındı: ' + fmt(r.price));
    await refresh();
  } catch (e) {
    say(e.message, true);
  } finally {
    $('btnAdd').disabled = false;
  }
});

$('btnPaste').addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    $('url').value = t;
    if (extractUrl(t)) $('addForm').requestSubmit();
    else say('Panoda ürün linki yok.', true);
  } catch (_) {
    say('Panoya erişilemedi. Linki kutuya elle yapıştırın.', true);
  }
});

$('btnCheck').addEventListener('click', async () => {
  $('btnCheck').disabled = true;
  say('Fiyatlar kontrol ediliyor…');
  try {
    const s = await api('check');
    say(s.checked + ' ürün okundu, ' + s.failed + ' okunamadı, ' + s.notified + ' bildirim gönderildi.');
    await refresh();
  } catch (e) { say(e.message, true); } finally { $('btnCheck').disabled = false; }
});

$('btnThr').addEventListener('click', async () => {
  try { await api('threshold', { value: Number($('thr').value) }); say('Eşik kaydedildi.'); }
  catch (e) { say(e.message, true); }
});

$('btnOut').addEventListener('click', () => {
  try { localStorage.removeItem('panelKey'); } catch (_) { /* yoksay */ }
  KEY = ''; show('login');
});

(async () => {
  if (!KEY) { show('login'); return; }
  try { await refresh(); } catch (e) { show('login'); if (!e.auth) $('loginMsg').textContent = e.message; }
})();
</script>
</body>
</html>
