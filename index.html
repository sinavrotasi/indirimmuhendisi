<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b8a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İndirim Mühendisi">
<title>İndirim Mühendisi</title>
<style>
  :root {
    --bg: #f3f6f4; --card: #ffffff; --ink: #14201c; --mute: #6b7772; --line: #e4e9e6;
    --brand: #0b8a5f; --on-brand: #ffffff; --good: #15803d; --bad: #b91c1c; --warn: #b45309;
    --chip-good: #dcfce7; --chip-bad: #fee2e2; --chip-flat: #eaefec;
    --shadow: 0 1px 2px rgba(16,40,30,.05), 0 6px 18px rgba(16,40,30,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1514; --card: #16201e; --ink: #e8efec; --mute: #94a39d; --line: #243330;
      --brand: #34d399; --on-brand: #04261c; --good: #4ade80; --bad: #f87171; --warn: #fbbf24;
      --chip-good: #12331f; --chip-bad: #3a1717; --chip-flat: #22302d;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 640px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  [hidden] { display: none !important; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; line-height: 1.2; }
  h2 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  header { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; }
  .logo { width: 42px; height: 42px; border-radius: 13px; background: var(--brand); color: var(--on-brand);
    display: grid; place-items: center; flex: none; }
  .logo svg { width: 23px; height: 23px; }
  .brandtxt { flex: 1; min-width: 0; }
  .tag { font-size: 12.5px; color: var(--mute); }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 11px 14px;
    background: var(--brand); color: var(--on-brand); cursor: pointer;
  }
  button:disabled { opacity: .55; }
  button.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  button.small { padding: 7px 10px; font-size: 14px; }
  .iconbtn { width: 42px; height: 42px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .iconbtn svg { width: 20px; height: 20px; }
  .iconbtn:disabled svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.go {
    display: inline-block; padding: 6px 12px; font-size: 14px; font-weight: 700; border-radius: 12px;
    border: 1.5px solid var(--brand); color: var(--brand); background: transparent; text-decoration: none; white-space: nowrap;
  }
  input {
    font: inherit; width: 100%; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--card); color: var(--ink);
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .search { position: relative; margin-bottom: 10px; }
  .search svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--mute); pointer-events: none; }
  .search input { padding-left: 40px; box-shadow: var(--shadow); }
  form.add { display: flex; gap: 8px; }
  .linkin { position: relative; flex: 1; min-width: 0; }
  .linkin input { padding-right: 48px; box-shadow: var(--shadow); }
  .paste { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; padding: 0;
    display: grid; place-items: center; background: var(--chip-flat); color: var(--ink); border-radius: 11px; }
  .paste svg { width: 18px; height: 18px; }
  #btnAdd { white-space: nowrap; padding: 11px 16px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #msg { min-height: 1.4em; margin: 6px 2px 0; color: var(--mute); font-size: 14px; }
  #msg.err { color: var(--bad); }
  ul { list-style: none; margin: 0; padding: 0; }
  .tiles { display: flex; gap: 8px; margin: 10px 0; align-items: stretch; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; padding: 2px 1px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button.tile { flex: 1 0 auto; min-width: 62px; display: grid; justify-items: center; gap: 1px; padding: 8px 10px 7px;
    background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .tile b { font-size: 16px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tile span.lb { font-size: 11px; color: var(--mute); font-weight: 600; }
  .tabs button.tile[aria-pressed="true"] { border-color: var(--brand); background: var(--chip-good); }
  .pb { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; font-size: 10px; font-weight: 800;
    letter-spacing: -.02em; line-height: 1; flex: none; }
  .tiles .iconbtn { border-radius: 16px; width: 46px; height: auto; align-self: stretch; margin: 2px 0; }
  .settings { display: grid; gap: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 14px; color: var(--mute);
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .settings .row { align-items: center; }
  .settings .row > label { flex: 1 1 auto; }
  .settings .row > select, .settings .row > input, .settings .row > button { flex: none; }
  .settings input { width: 80px; text-align: center; }
  .listhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 2px 2px; }
  .pill { background: var(--chip-good); color: var(--good); font-weight: 700; font-size: 13px; padding: 5px 11px;
    border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .subline { font-size: 12.5px; color: var(--mute); margin: 0 2px 10px; min-height: 1em; }
  li.item {
    display: grid; grid-template-columns: 68px 1fr auto; gap: 8px 12px; padding: 12px; margin-bottom: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  }
  li.item.noring .main { grid-column: 2 / -1; }
  .thumb { position: relative; width: 68px; height: 68px; }
  .thumb img, .noimg {
    width: 68px; height: 68px; object-fit: contain; border-radius: 12px; background: #fff;
    border: 1px solid var(--line); display: block;
  }
  .noimg { background: var(--chip-flat); }
  .thumb .pb { position: absolute; left: -5px; top: -5px; box-shadow: 0 0 0 2px var(--card); }
  .main { min-width: 0; }
  .title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--ink); font-weight: 600; text-decoration: none; font-size: 15px;
  }
  .prices { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin-top: 6px; }
  .now { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .was { color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .chip.good { background: var(--chip-good); color: var(--good); }
  .chip.bad { background: var(--chip-bad); color: var(--bad); }
  .chip.flat { background: var(--chip-flat); color: var(--mute); }
  .chip.low { background: var(--chip-good); color: var(--good); }
  .ring { width: 64px; text-align: center; }
  .ring .rv { position: relative; width: 60px; height: 60px; margin: 0 auto; }
  .ring svg { width: 60px; height: 60px; transform: rotate(-90deg); display: block; }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ring .tp { font-size: 11px; color: var(--mute); margin-top: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .foot { grid-column: 1 / -1; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--mute); font-size: 12px; }
  .meta .warn { color: var(--warn); font-weight: 600; }
  svg.spark { width: 100%; height: 28px; display: block; }
  .acts { display: flex; gap: 6px; align-items: center; }
  .more { width: 34px; height: 32px; padding: 0; border-radius: 12px; font-size: 18px; line-height: 1; letter-spacing: 1px; }
  .menu { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  .empty { text-align: center; color: var(--mute); padding: 32px 8px; }
  .login { margin-top: 20vh; display: grid; gap: 12px; }
  .login form.add { display: grid; }
  .login p { margin: 0; color: var(--mute); }
  select { font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
  li.item .detail { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; }
  svg.big { width: 100%; height: 120px; display: block; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 8px 0 4px; font-size: 14px; }
  .stats b { display: block; font-variant-numeric: tabular-nums; }
  .stats span, .legend { font-size: 12px; color: var(--mute); }
  .legend { margin-bottom: 10px; text-align: center; }
  .goalform { display: flex; gap: 8px; }
  .goalform input { flex: 1; min-width: 0; }
  .goalform select { flex: none; }
  .cats { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 4px; padding: 2px 16px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { flex: none; padding: 6px 12px; font-size: 13px; font-weight: 600; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; }
  .cats button small { color: var(--mute); margin-left: 4px; font-weight: 600; }
  .cats button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .cats button[aria-pressed="true"] small { color: inherit; opacity: .85; }
  .grp { list-style: none; margin: 14px 2px 6px; color: var(--ink); font-weight: 700; font-size: 15px; display: flex; align-items: baseline; gap: 6px; }
  .grp small { color: var(--mute); font-weight: 600; font-size: 12px; }
  .grp.cat { margin-top: 8px; font-size: 13px; color: var(--mute); text-transform: none; }
  .catform { display: flex; gap: 8px; margin-top: 10px; }
  .catform input { flex: 1; min-width: 0; }
  .goalhint { margin: 6px 2px 0; font-size: 12px; color: var(--mute); min-height: 16px; }
  label.switch { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--mute); }
  label.switch input { width: 20px; height: 20px; flex: none; accent-color: var(--brand); }
</style>
</head>
<body>
<main>
  <section id="login" class="login" hidden>
    <h1>İndirim Mühendisi</h1>
    <p>Devam etmek için panel şifrenizi girin.</p>
    <form id="loginForm" class="add">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Şifre" required>
      <button type="submit">Giriş</button>
    </form>
    <div id="loginMsg" class="err" role="alert"></div>
  </section>

  <section id="panel" hidden>
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor"/></svg>
      </div>
      <div class="brandtxt">
        <h1>İndirim Mühendisi</h1>
        <div class="tag">Doğru zamanda, doğru fiyat</div>
      </div>
      <button id="btnCheck" class="iconbtn" type="button" aria-label="Şimdi kontrol et" title="Şimdi kontrol et">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Takip edilen ürünlerde ara…" aria-label="Takip edilen ürünlerde ara">
    </div>

    <form id="addForm" class="add">
      <div class="linkin">
        <input id="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="Ürün linkini yapıştır" aria-label="Ürün linki (Hepsiburada, Trendyol, Amazon, N11)">
        <button id="btnPaste" class="paste" type="button" aria-label="Panodan yapıştır" title="Panodan yapıştır">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
        </button>
      </div>
      <button id="btnAdd" type="submit">+ Takibe Al</button>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>

    <div class="tiles">
      <div id="tabs" class="tabs"></div>
      <button id="btnSet" class="iconbtn" type="button" aria-label="Ayarlar ve sıralama" aria-expanded="false" title="Ayarlar ve sıralama">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>

    <div id="settings" class="settings" hidden>
      <div class="row">
        <label for="sort">Sıralama</label>
        <select id="sort">
          <option value="new">Yeni eklenen</option>
          <option value="drop">En çok düşen</option>
          <option value="goal">Hedefe yakın</option>
        </select>
      </div>
      <div class="row">
        <label for="thr">En az % kaç düşüşte haber verilsin?</label>
        <input id="thr" type="number" min="0" max="90" step="0.5" inputmode="decimal">
        <button id="btnThr" class="ghost small" type="button">Kaydet</button>
      </div>
      <div><button id="btnOut" class="ghost small" type="button">Çıkış</button></div>
    </div>

    <div id="cats" class="cats" hidden></div>
    <div id="listhead" class="listhead"></div>
    <div id="subline" class="subline"></div>
    <ul id="list"></ul>
  </section>
</main>

<script>
const API = 'https://owbrssrwrfpfidplbofd.supabase.co/functions/v1/panel-api';
const $ = (id) => document.getElementById(id);
let KEY = '';
try { KEY = localStorage.getItem('panelKey') || ''; } catch (_) { /* depolama kapalı olabilir */ }

const fmt = (n) => Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TL';
const SOURCE = { hepsiburada: 'Hepsiburada', trendyol: 'Trendyol', amazon: 'Amazon', n11: 'N11' };

async function api(action, body = {}) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-panel-key': KEY },
    body: JSON.stringify({ action, ...body }),
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { const e = new Error(j.error || 'Şifre yanlış'); e.auth = true; throw e; }
  if (!r.ok) throw new Error(j.error || ('Hata (' + r.status + ')'));
  return j;
}

function say(text, isErr = false) {
  const m = $('msg');
  m.textContent = text || '';
  m.className = isErr ? 'err' : '';
}

function show(which) {
  $('login').hidden = which !== 'login';
  $('panel').hidden = which !== 'panel';
}

function ago(iso) {
  if (!iso) return 'henüz kontrol edilmedi';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 2) return 'az önce';
  if (m < 60) return m + ' dk önce';
  const h = Math.round(m / 60);
  return h < 24 ? h + ' sa önce' : Math.round(h / 24) + ' gün önce';
}

function spark(hist, base) {
  if (!hist || hist.length < 2) return null;
  const W = 100, H = 28;
  const vals = hist.map((h) => h[1]);
  const lo = Math.min(...vals, base), hi = Math.max(...vals, base), rng = (hi - lo) || 1;
  const x = (i) => (i / (hist.length - 1)) * W;
  const y = (v) => H - 3 - ((v - lo) / rng) * (H - 6);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('class', 'spark');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Fiyat geçmişi');
  const bl = document.createElementNS(ns, 'line');
  bl.setAttribute('x1', 0); bl.setAttribute('x2', W); bl.setAttribute('y1', y(base)); bl.setAttribute('y2', y(base));
  bl.setAttribute('stroke', 'currentColor'); bl.setAttribute('stroke-opacity', '.35');
  bl.setAttribute('stroke-dasharray', '2 2'); bl.setAttribute('vector-effect', 'non-scaling-stroke');
  svg.appendChild(bl);
  const pl = document.createElementNS(ns, 'polyline');
  pl.setAttribute('points', vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' '));
  pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', 'var(--brand)'); pl.setAttribute('stroke-width', '2');
  pl.setAttribute('stroke-linejoin', 'round'); pl.setAttribute('vector-effect', 'non-scaling-stroke');
  svg.appendChild(pl);
  svg.style.color = 'var(--mute)';
  return svg;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const OPEN = new Set();
let DATA = null;
let SORT = 'new';
try { SORT = localStorage.getItem('sortMode') || 'new'; } catch (_) { /* yoksay */ }
if (!['new', 'drop', 'goal'].includes(SORT)) SORT = 'new';
let CAT = '';
try { CAT = localStorage.getItem('catFilter') || ''; } catch (_) { /* yoksay */ }
let Q = '';
let SHOP = 'all';
try { SHOP = localStorage.getItem('shopFilter') || 'all'; } catch (_) { /* yoksay */ }
if (SHOP !== 'all' && !(SHOP in SOURCE)) SHOP = 'all';

const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Fiyat geçmişi (adım grafiği): zaman ekseni, eklendiği fiyat ve hedef çizgisi
function bigChart(hist, cur, base, target) {
  const W = 300, H = 120, PX = 4, PY = 10;
  const pts = hist.map((h) => [new Date(h[0]).getTime(), h[1]]);
  const now = Date.now();
  if (!pts.length || pts[pts.length - 1][0] < now) pts.push([now, cur]);
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  const ys = pts.map((p) => p[1]).concat([base], target ? [target] : []);
  const lo = Math.min(...ys), hi = Math.max(...ys), rng = (hi - lo) || 1;
  const x = (t) => PX + ((t - t0) / ((t1 - t0) || 1)) * (W - 2 * PX);
  const y = (v) => H - PY - ((v - lo) / rng) * (H - 2 * PY);
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'big', role: 'img', 'aria-label': 'Fiyat geçmişi grafiği' });
  const guide = (v, color, dash) => svg.appendChild(svgEl('line', {
    x1: 0, x2: W, y1: y(v), y2: y(v), stroke: color, 'stroke-width': 1,
    'stroke-dasharray': dash, 'vector-effect': 'non-scaling-stroke',
  }));
  guide(base, 'var(--mute)', '3 3');
  if (target) guide(target, 'var(--good)', '1 3');
  let d = '';
  pts.forEach((p, i) => {
    d += (i === 0 ? 'M' + x(p[0]).toFixed(1) + ' ' : 'H' + x(p[0]).toFixed(1) + ' V') + y(p[1]).toFixed(1) + ' ';
  });
  svg.appendChild(svgEl('path', {
    d, fill: 'none', stroke: 'var(--brand)', 'stroke-width': 2, 'stroke-linejoin': 'round',
    'vector-effect': 'non-scaling-stroke',
  }));
  const last = pts[pts.length - 1];
  svg.appendChild(svgEl('circle', { cx: x(last[0]), cy: y(last[1]), r: 3.5, fill: 'var(--brand)' }));
  return svg;
}

// En düşük / en yüksek / zamana göre ağırlıklı ortalama
function stats(hist, cur) {
  const pts = hist.map((h) => [new Date(h[0]).getTime(), h[1]]);
  const now = Date.now();
  if (!pts.length) pts.push([now, cur]);
  let sum = 0, span = 0, lo = Infinity, hi = -Infinity;
  for (let i = 0; i < pts.length; i++) {
    const end = i + 1 < pts.length ? pts[i + 1][0] : Math.max(now, pts[i][0]);
    const w = Math.max(end - pts[i][0], 0);
    sum += pts[i][1] * w; span += w;
    lo = Math.min(lo, pts[i][1]); hi = Math.max(hi, pts[i][1]);
  }
  lo = Math.min(lo, cur); hi = Math.max(hi, cur);
  return { lo, hi, avg: span > 0 ? sum / span : cur, distinct: new Set(pts.map((p) => p[1])).size };
}

function enrich(it) {
  const p = it.product;
  const base = Number(it.baselinePrice);
  const cur = p.lastPrice === null ? base : Number(p.lastPrice);
  const target = it.targetPrice === null || it.targetPrice === undefined ? null : Number(it.targetPrice);
  return { it, p, base, cur, d: (cur - base) / base * 100, target, st: stats(it.history || [], cur) };
}

function goalRatio(e) {
  if (e.target === null) return -1;
  if (e.cur <= e.target) return 1;
  return Math.max(0, Math.min(1, (e.base - e.cur) / (e.base - e.target)));
}

const BADGE = {
  hepsiburada: ['hb', '#FF6000', '#ffffff'],
  trendyol: ['T', '#F2542D', '#ffffff'],
  amazon: ['a', '#FFB020', '#1f2937'],
  n11: ['n11', '#7A3FD1', '#ffffff'],
};
function badge(src) {
  const b = BADGE[src];
  const s = el('span', 'pb', b ? b[0] : '?');
  if (b) { s.style.background = b[1]; s.style.color = b[2]; } else { s.style.background = 'var(--chip-flat)'; }
  s.setAttribute('aria-hidden', 'true');
  return s;
}

// Hedef halkası: ortada indirim %'si, altında hedef fiyat, yay = hedefe ne kadar yaklaşıldığı
function ring(e) {
  const C = 194.8;
  const hit = e.cur <= e.target;
  const pct = Math.max(0, Math.round((e.base - e.target) / e.base * 100));
  const tp = Math.round(e.target).toLocaleString('tr-TR') + ' TL';
  const box = el('div', 'ring');
  box.setAttribute('role', 'img');
  box.setAttribute('aria-label', 'Hedef %' + pct + ', ' + tp + (hit ? ', ulaşıldı' : ', ' + fmt(e.cur - e.target) + ' kaldı'));
  const rv = el('div', 'rv');
  const svg = svgEl('svg', { viewBox: '0 0 72 72', 'aria-hidden': 'true' });
  svg.appendChild(svgEl('circle', { cx: 36, cy: 36, r: 31, fill: 'none', stroke: 'var(--chip-flat)', 'stroke-width': 7 }));
  svg.appendChild(svgEl('circle', {
    cx: 36, cy: 36, r: 31, fill: 'none', stroke: hit ? 'var(--good)' : 'var(--brand)', 'stroke-width': 7,
    'stroke-linecap': 'round', 'stroke-dasharray': (goalRatio(e) * C).toFixed(1) + ' ' + C,
  }));
  rv.appendChild(svg);
  rv.appendChild(el('span', 'pct', '%' + pct));
  box.appendChild(rv);
  box.appendChild(el('div', 'tp', tp));
  return box;
}

function renderSummary(list) {
  const head = $('listhead');
  head.replaceChildren();
  head.appendChild(el('h2', '', 'Takip Ettiklerim (' + list.length + ')'));
  let saved = 0, down = 0, goals = 0;
  for (const e of list) {
    if (e.cur < e.base) { saved += e.base - e.cur; down++; }
    if (e.target !== null && e.cur <= e.target) goals++;
  }
  if (saved > 0) head.appendChild(el('span', 'pill', fmt(saved) + ' Tasarruf'));
  const bits = [];
  if (list.length) bits.push(list.length + ' üründen ' + down + ' tanesi ucuzladı');
  if (goals) bits.push(goals + ' hedefe ulaştı');
  $('subline').textContent = bits.join(' · ');
}

function renderTabs(all) {
  const box = $('tabs');
  box.replaceChildren();
  const count = (k) => k === 'all' ? all.length : all.filter((e) => e.p.source === k).length;
  const tabs = [['all', 'Tümü']].concat(Object.keys(SOURCE).filter((k) => count(k) > 0).map((k) => [k, SOURCE[k]]));
  for (const [k, t] of tabs) {
    const b = el('button', 'tile');
    b.type = 'button';
    if (k === 'all') {
      const s = el('span', 'pb', '#');
      s.style.background = 'var(--ink)'; s.style.color = 'var(--card)';
      b.appendChild(s);
    } else b.appendChild(badge(k));
    b.appendChild(el('b', '', String(count(k))));
    b.appendChild(el('span', 'lb', t));
    b.setAttribute('aria-pressed', k === SHOP ? 'true' : 'false');
    b.addEventListener('click', () => {
      SHOP = k;
      try { localStorage.setItem('shopFilter', SHOP); } catch (_) { /* yoksay */ }
      render(DATA);
    });
    box.appendChild(b);
  }
}

const NOCAT = '\u0000none';
function renderCats(pool) {
  const box = $('cats');
  box.replaceChildren();
  const norm = (c) => (c || '').toLocaleLowerCase('tr');
  const names = new Map();
  let none = 0;
  for (const e of pool) {
    const c = e.it.category;
    if (!c) { none++; continue; }
    const k = norm(c);
    const cur = names.get(k) || { name: c, n: 0 };
    cur.n++; names.set(k, cur);
  }
  if (!names.size) { box.hidden = true; if (CAT) setCat(''); return; }
  if (CAT && CAT !== NOCAT && !names.has(CAT)) setCat('');
  if (CAT === NOCAT && !none) setCat('');
  box.hidden = false;
  const chips = [['', 'Tüm kategoriler', pool.length]];
  [...names.entries()].sort((a, b) => a[0].localeCompare(b[0], 'tr'))
    .forEach(([k, v]) => chips.push([k, v.name, v.n]));
  if (none) chips.push([NOCAT, 'Kategorisiz', none]);
  for (const [k, t, n] of chips) {
    const b = el('button', '', t);
    b.type = 'button';
    b.appendChild(el('small', '', String(n)));
    b.setAttribute('aria-pressed', k === CAT ? 'true' : 'false');
    b.addEventListener('click', () => { setCat(k); render(DATA); });
    box.appendChild(b);
  }
}
function setCat(k) {
  CAT = k;
  try { localStorage.setItem('catFilter', CAT); } catch (_) { /* yoksay */ }
}

function renderDetail(e) {
  const box = el('div', 'detail');
  box.appendChild(bigChart(e.it.history || [], e.cur, e.base, e.target));
  const row = el('div', 'stats');
  for (const [lab, val] of [['En düşük', e.st.lo], ['Ortalama', e.st.avg], ['En yüksek', e.st.hi]]) {
    const c = el('div');
    c.appendChild(el('b', '', fmt(val)));
    c.appendChild(el('span', '', lab));
    row.appendChild(c);
  }
  box.appendChild(row);
  box.appendChild(el('div', 'legend', '– – eklendiği fiyat' + (e.target !== null ? ' · ··· hedef fiyat' : '') + ' · son 90 gün'));

  const form = el('form', 'goalform');
  const mode = el('select');
  mode.setAttribute('aria-label', 'Hedef türü');
  for (const [v, t] of [['tl', 'TL'], ['pct', '% indirim']]) {
    const o = el('option', '', t); o.value = v; mode.appendChild(o);
  }
  const inp = document.createElement('input');
  inp.type = 'number'; inp.step = '0.01'; inp.min = '0'; inp.inputMode = 'decimal';
  const hint = el('div', 'goalhint');
  const pctOf = (t) => Math.round((e.base - t) / e.base * 1000) / 10;
  const toTl = (pc) => Math.round(e.base * (1 - pc / 100) * 100) / 100;
  const setMode = (m) => {
    mode.value = m;
    inp.placeholder = m === 'pct' ? '🎯 Eklendiği fiyattan % indirim' : '🎯 Hedef fiyat (TL)';
    inp.setAttribute('aria-label', m === 'pct' ? 'Hedef indirim yüzdesi' : 'Hedef fiyat');
    inp.max = m === 'pct' ? '99' : '';
    inp.value = '';
    if (e.target !== null) {
      inp.value = m === 'pct' ? String(pctOf(e.target)) : String(e.target);
    }
    preview();
  };
  const preview = () => {
    const v = Number(inp.value);
    if (inp.value === '' || !Number.isFinite(v) || v <= 0) {
      hint.textContent = e.target !== null
        ? 'Şu an: ' + fmt(e.target) + ' (eklendiği fiyattan %' + String(pctOf(e.target)).replace('.', ',') + ' indirim)'
        : 'Eklendiği fiyat: ' + fmt(e.base);
      return;
    }
    if (mode.value === 'pct') {
      hint.textContent = v >= 100 ? 'Yüzde 100\'den küçük olmalı' : '= ' + fmt(toTl(v)) + ' ve altına düşünce bildirim';
    } else {
      hint.textContent = '= eklendiği fiyattan %' + String(pctOf(v)).replace('.', ',') + ' indirim';
    }
  };
  inp.addEventListener('input', preview);
  mode.addEventListener('change', () => setMode(mode.value));
  const save = el('button', 'small', 'Kaydet');
  save.type = 'submit';
  form.appendChild(mode); form.appendChild(inp); form.appendChild(save);
  if (e.target !== null) {
    const clr = el('button', 'ghost small', 'Kaldır');
    clr.type = 'button';
    clr.addEventListener('click', async () => {
      try { await api('target', { id: e.it.id, value: null }); say('Hedef kaldırıldı.'); await refresh(); }
      catch (err) { say(err.message, true); }
    });
    form.appendChild(clr);
  }
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const n = Number(inp.value);
    if (inp.value === '' || !Number.isFinite(n) || n <= 0) { say('Bir hedef yazın.', true); return; }
    let value = n;
    if (mode.value === 'pct') {
      if (n >= 100) { say('İndirim yüzdesi 100\'den küçük olmalı.', true); return; }
      value = toTl(n);
    }
    save.disabled = true;
    try {
      await api('target', { id: e.it.id, value });
      say('Hedef kaydedildi: ' + fmt(value) + ' (%' + String(pctOf(value)).replace('.', ',') + ' indirim) ve altına düşünce özel bildirim gelir.');
      await refresh();
    } catch (err) { say(err.message, true); save.disabled = false; }
  });
  setMode('tl');
  box.appendChild(form);
  box.appendChild(hint);

  const cform = el('form', 'catform');
  const cin = document.createElement('input');
  cin.type = 'text'; cin.maxLength = 30; cin.placeholder = '📁 Kategori (örn. Telefon)';
  cin.setAttribute('aria-label', 'Kategori');
  cin.autocapitalize = 'sentences';
  cin.value = e.it.category || '';
  const dl = document.createElement('datalist');
  dl.id = 'cats-' + e.it.id;
  const seen = new Set();
  for (const x of DATA.items) {
    const c = x.category;
    if (c && !seen.has(c.toLocaleLowerCase('tr'))) {
      seen.add(c.toLocaleLowerCase('tr'));
      const o = document.createElement('option'); o.value = c; dl.appendChild(o);
    }
  }
  cin.setAttribute('list', dl.id);
  const csave = el('button', 'small', 'Kaydet');
  csave.type = 'submit';
  cform.appendChild(cin); cform.appendChild(dl); cform.appendChild(csave);
  cform.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    csave.disabled = true;
    try {
      const r = await api('category', { id: e.it.id, value: cin.value });
      say(r.category ? 'Kategori: ' + r.category : 'Kategori kaldırıldı.');
      await refresh();
    } catch (err) { say(err.message, true); csave.disabled = false; }
  });
  box.appendChild(cform);

  const row2 = el('label', 'switch');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = e.it.notifyAnyChange === true;
  row2.appendChild(cb);
  row2.appendChild(el('span', '', 'Her fiyat değişiminde haber ver (artış dahil)'));
  cb.addEventListener('change', async () => {
    cb.disabled = true;
    try {
      await api('notify', { id: e.it.id, value: cb.checked });
      e.it.notifyAnyChange = cb.checked;
      say(cb.checked ? 'Bu üründe her fiyat değişimi bildirilecek.' : 'Sadece indirimler bildirilecek.');
    } catch (err) { cb.checked = !cb.checked; say(err.message, true); }
    cb.disabled = false;
  });
  box.appendChild(row2);
  return box;
}

function render(data) {
  DATA = data;
  const ul = $('list');
  ul.replaceChildren();
  $('thr').value = data.minDropPct;
  const all = data.items.map(enrich);
  if (SHOP !== 'all' && !all.some((e) => e.p.source === SHOP)) SHOP = 'all';
  renderTabs(all);
  const pool = SHOP === 'all' ? all : all.filter((e) => e.p.source === SHOP);
  renderCats(pool);
  const normC = (c) => (c || '').toLocaleLowerCase('tr');
  let list = !CAT ? pool
    : pool.filter((e) => CAT === NOCAT ? !e.it.category : normC(e.it.category) === CAT);
  const qn = Q.trim().toLocaleLowerCase('tr');
  if (qn) list = list.filter((e) => (e.p.title || '').toLocaleLowerCase('tr').includes(qn));
  renderSummary(list);
  if (!list.length) {
    ul.appendChild(el('li', 'empty', qn ? 'Aramayla eşleşen ürün yok.' : all.length
      ? 'Bu mağazada takip ettiğin ürün yok.'
      : 'Henüz takip ettiğin ürün yok. Yukarıya bir link yapıştır.'));
    return;
  }
  if (SORT === 'drop') list.sort((a, b) => a.d - b.d);
  else if (SORT === 'goal') list.sort((a, b) => goalRatio(b) - goalRatio(a));
  else list.sort((a, b) => new Date(b.it.addedAt) - new Date(a.it.addedAt) || b.it.id - a.it.id);

  // Platform > kategori gruplama: gruplar, içlerindeki en iyi ürünün sırasına göre dizilir,
  // böylece seçili sıralamanın birincisi her zaman en üstte olur
  const norm = (c) => (c || '').toLocaleLowerCase('tr');
  const hasCat = list.some((e) => e.it.category);
  const platRank = {}, catRankMap = {};
  list.forEach((e, i) => {
    if (platRank[e.p.source] === undefined) platRank[e.p.source] = i;
    const ck = (SHOP === 'all' ? e.p.source : '') + '|' + norm(e.it.category);
    if (catRankMap[ck] === undefined) catRankMap[ck] = i;
    e.idx = i; e.pr = platRank[e.p.source]; e.cr = catRankMap[ck];
  });
  list.sort((a, b) =>
    (SHOP === 'all' ? a.pr - b.pr : 0) || (hasCat ? a.cr - b.cr : 0) || a.idx - b.idx);
  const platCount = {}, catCount = {};
  for (const e of list) {
    platCount[e.p.source] = (platCount[e.p.source] || 0) + 1;
    const ck = e.p.source + '|' + norm(e.it.category);
    catCount[ck] = (catCount[ck] || 0) + 1;
  }
  let lastPlat = null, lastCat = null;

  for (const e of list) {
    const { it, p, base, cur, d, target } = e;
    if (SHOP === 'all' && p.source !== lastPlat) {
      const h = el('li', 'grp', SOURCE[p.source] || p.source);
      h.appendChild(el('small', '', String(platCount[p.source])));
      ul.appendChild(h);
      lastPlat = p.source; lastCat = null;
    }
    if (hasCat && !CAT && norm(it.category) !== lastCat) {
      const name = it.category || 'Kategorisiz';
      const h = el('li', 'grp cat', '📁 ' + name);
      h.appendChild(el('small', '', String(catCount[p.source + '|' + norm(it.category)])));
      ul.appendChild(h);
      lastCat = norm(it.category);
    }
    const li = el('li', 'item' + (target === null ? ' noring' : ''));

    const th = el('div', 'thumb');
    if (p.imageUrl && /^https:\/\//.test(p.imageUrl)) {
      const img = document.createElement('img');
      img.src = p.imageUrl; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      th.appendChild(img);
    } else {
      th.appendChild(el('div', 'noimg'));
    }
    th.appendChild(badge(p.source));
    li.appendChild(th);

    const box = el('div', 'main');
    const a = el('a', 'title', p.title || 'Ürün');
    if (/^https:\/\//.test(p.url)) { a.href = p.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    box.appendChild(a);

    const prices = el('div', 'prices');
    prices.appendChild(el('span', 'now', fmt(cur)));
    prices.appendChild(el('span', 'was', 'eklerken ' + fmt(base)));
    const flat = Math.abs(d) < 0.05;
    prices.appendChild(el('span', 'chip ' + (flat ? 'flat' : d < 0 ? 'good' : 'bad'),
      flat ? 'değişmedi' : (d < 0 ? '−%' : '+%') + Math.abs(d).toFixed(1).replace('.', ',')));
    if (e.st.distinct > 1 && cur <= e.st.lo) prices.appendChild(el('span', 'chip low', '⭐ En düşük'));
    box.appendChild(prices);
    li.appendChild(box);

    if (target !== null) li.appendChild(ring(e));

    const foot = el('div', 'foot');
    const sp = spark(it.history, base);
    if (sp) foot.appendChild(sp);

    const meta = el('div', 'meta');
    const left = el('span');
    const broken = p.failCount >= 3;
    left.textContent = (SOURCE[p.source] || p.source) + ' · ' + (broken ? '' : ago(p.lastCheckedAt));
    if (broken) { left.appendChild(el('span', 'warn', 'fiyat okunamıyor')); }
    meta.appendChild(left);
    const acts = el('span', 'acts');
    if (/^https:\/\//.test(p.url)) {
      const go = el('a', 'go', 'Ürüne git ↗');
      go.href = p.url; go.target = '_blank'; go.rel = 'noopener noreferrer';
      acts.appendChild(go);
    }
    const open = OPEN.has(it.id);
    const more = el('button', 'ghost more', '⋯');
    more.type = 'button';
    more.setAttribute('aria-label', 'Diğer işlemler');
    more.setAttribute('aria-expanded', String(open));
    acts.appendChild(more);
    meta.appendChild(acts);
    foot.appendChild(meta);

    const menu = el('div', 'menu');
    menu.hidden = !open;
    more.addEventListener('click', () => {
      menu.hidden = !menu.hidden;
      more.setAttribute('aria-expanded', String(!menu.hidden));
    });
    const det = el('button', 'ghost small', open ? 'Detayı kapat' : 'Detay');
    det.type = 'button';
    det.addEventListener('click', () => { if (OPEN.has(it.id)) OPEN.delete(it.id); else OPEN.add(it.id); render(DATA); });
    menu.appendChild(det);
    const del = el('button', 'ghost small', 'Sil');
    del.type = 'button';
    del.addEventListener('click', async () => {
      if (!confirm('Bu ürün takipten çıkarılsın mı?')) return;
      del.disabled = true;
      try { await api('remove', { id: it.id }); OPEN.delete(it.id); await refresh(); } catch (err) { say(err.message, true); del.disabled = false; }
    });
    menu.appendChild(del);
    foot.appendChild(menu);
    li.appendChild(foot);

    if (open) li.appendChild(renderDetail(e));
    ul.appendChild(li);
  }
}

async function refresh() {
  const data = await api('list');
  show('panel');
  render(data);
}

function extractUrl(text) {
  const m = String(text).match(/https?:\/\/[^\s<>"]+/i);
  return m ? m[0].replace(/[).,;]+$/, '') : null;
}

$('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  KEY = $('pw').value;
  $('loginMsg').textContent = '';
  try {
    await refresh();
    try { localStorage.setItem('panelKey', KEY); } catch (_) { /* yoksay */ }
    $('pw').value = '';
  } catch (e) {
    $('loginMsg').textContent = e.message;
    KEY = '';
  }
});

$('addForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const url = extractUrl($('url').value);
  if (!url) { say('Geçerli bir ürün linki bulamadım.', true); return; }
  $('btnAdd').disabled = true;
  say('Fiyat okunuyor…');
  try {
    const r = await api('add', { url });
    $('url').value = '';
    say(r.status === 'exists'
      ? 'Zaten takipte: eklenen fiyat ' + fmt(r.baseline) + ', şimdi ' + fmt(r.price)
      : 'Takibe alındı: ' + fmt(r.price));
    await refresh();
  } catch (e) {
    say(e.message, true);
  } finally {
    $('btnAdd').disabled = false;
  }
});

$('btnPaste').addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    $('url').value = t;
    if (extractUrl(t)) $('addForm').requestSubmit();
    else say('Panoda ürün linki yok.', true);
  } catch (_) {
    say('Panoya erişilemedi. Linki kutuya elle yapıştırın.', true);
  }
});

$('btnCheck').addEventListener('click', async () => {
  $('btnCheck').disabled = true;
  say('Fiyatlar kontrol ediliyor…');
  try {
    const s = await api('check');
    say(s.checked + ' ürün okundu, ' + s.failed + ' okunamadı, ' + s.notified + ' bildirim gönderildi.');
    await refresh();
  } catch (e) { say(e.message, true); } finally { $('btnCheck').disabled = false; }
});

$('btnThr').addEventListener('click', async () => {
  try { await api('threshold', { value: Number($('thr').value) }); say('Eşik kaydedildi.'); }
  catch (e) { say(e.message, true); }
});

$('q').addEventListener('input', () => { Q = $('q').value; if (DATA) render(DATA); });
$('sort').value = SORT;
$('sort').addEventListener('change', () => {
  SORT = $('sort').value;
  try { localStorage.setItem('sortMode', SORT); } catch (_) { /* yoksay */ }
  if (DATA) render(DATA);
});
$('btnSet').addEventListener('click', () => {
  const box = $('settings');
  box.hidden = !box.hidden;
  $('btnSet').setAttribute('aria-expanded', String(!box.hidden));
});

$('btnOut').addEventListener('click', () => {
  try { localStorage.removeItem('panelKey'); } catch (_) { /* yoksay */ }
  KEY = ''; show('login');
});

(async () => {
  if (!KEY) { show('login'); return; }
  try { await refresh(); } catch (e) { show('login'); if (!e.auth) $('loginMsg').textContent = e.message; }
})();
</script>
